<!doctype html>
<html lang="en">
  <head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  </head>
  <body>
    ​
    <div class="container">
      <div class="col-md-6">
        <h2>Registeration form</h2>
        <form class="form-horizontal" id="RegFomr">
          <div class="form-group">
            <label class="control-label col-sm-2" for="Name">Name:</label>
            <div class="col-sm-10">
              <input
                type="text"
                class="form-control"
                id="Name"
                placeholder="Enter Name"
                name="Name"
                autofocus
              />
              <span class="text-danger" id="nameError"></span>
            </div>
          </div>
          <div class="form-group">
            <label class="control-label col-sm-2" for="LName">LName:</label>
            <div class="col-sm-10">
              <input
                type="text"
                class="form-control"
                id="LName"
                placeholder="Enter LName"
                LName="LName"
              />
              <span class="text-danger" id="lastNameError"></span>
            </div>
          </div>
          <div class="form-group">
            <label class="control-label col-sm-2" for="email">Email:</label>
            <div class="col-sm-10">
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter email"
                name="email"
              />
              <span class="text-danger" id="emailError"></span>
            </div>
          </div>
          <div class="form-group">
            <label class="control-label col-sm-2" for="Age">Age:</label>
            <div class="col-sm-10">
              <input
                type="number"
                class="form-control"
                id="Age"
                placeholder="Enter Age"
                name="Age"
              />
            </div>
          </div>
          <div class="form-group">
            <label class="control-label col-sm-2" for="article">article:</label>
            <div class="col-sm-10">
              <textarea
                name="article"
                id="article"
                class="form-control"
              ></textarea>
            </div>
          </div>

          <div class="form-group">
            <label class="control-label col-sm-2" for="country"
              >Your Country:</label
            >
            <div class="col-sm-10">
              <select name="country" id="country" class="form-control">
                <option value="afg">Afghanistan</option>
                <option value="Ir">Iran</option>
                <option value="pa">pakistan</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="control-label col-sm-2" for="country"
              >Your phone:</label
            >
            <div class="col-sm-10">
              <input
                type="text"
                class="form-control"
                placeholder="country Code"
                id="CountryCode"
              />
              <input
                type="text"
                class="form-control"
                placeholder="phone number"
                id="UserPhone"
              />
            </div>
          </div>

          <input type="submit" id="subBtn" class="btn btn-success" />
        </form>
      </div>
      <div class="col-md-6">
        <h2>User Info</h2>
        <p>
          name:
          <span id="userName"></span>
        </p>
        <p>
          last name:
          <span id="userLastName"></span>
        </p>
        <p>
          email:
          <span id="userEmail"></span>
        </p>
        <p>
          age:
          <span id="userAge"></span>
        </p>
        <p>
          article:
          <span id="userArticle"></span>
        </p>
        <p>
          Country:
          <span id="userCountry"></span>
        </p>
      </div>
    </div>

    <script src="registration-form.js"></script>
  </body>
</html>
